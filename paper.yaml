# paper.yaml — Agent-readable paper manifest
# This file is the source of truth for paper structure.

template: article

title: "Every Model Cheats: Prompt-Level Mitigation of Cheating on Offensive Cyber Tasks"
document_class: article
document_options: "11pt"

authors:
  - name: "Michael Kouremetis"
    affiliation: "dreadnode"
    email: "michael@dreadnode.io"
  - name: "Ads Dawson"
    affiliation: "dreadnode"
    email: "ads@dreadnode.io"
  - name: "Raja Sekhar Rao Dheekonda"
    affiliation: "dreadnode"
    email: "raja@dreadnode.io"
  - name: "Brian Greunke"
    affiliation: "dreadnode"
    email: "brian@dreadnode.io"

abstract_summary: >
  Study of cheating behavior across 22 LLMs from 7 vendors on 23 offensive
  cybersecurity tasks from CyBench. All models cheat. Prompt-level anti-cheat
  instructions reduce cheating by ~44% without harming legitimate capability.

